data_dir: /home/nathanielhoffman/Desktop/cel/physicsnemo/RUN-2
ckpt_path: ./checkpoints
stats_dir: ./stats
cuda_devices: null
train_fraction: 0.8
val_fraction: 0.1
timestep_stride: 10
grid_res:
- 32
- 16
- 16
num_sample_nodes: 2048
output_dim: 9
global_features: 1
model:
  model_type: volume
  activation: gelu
  interp_res:
  - 32
  - 16
  - 16
  use_sdf_in_basis_func: true
  num_neighbors_surface: 7
  num_neighbors_volume: 10
  combine_volume_surface: false
  return_volume_neighbors: false
  use_surface_normals: false
  use_surface_area: false
  geometry_encoding_type: both
  solution_calculation_mode: two-loop
  encode_parameters: false
  geometry_rep:
    geo_conv:
      base_neurons: 32
      base_neurons_in: 1
      base_neurons_out: 1
