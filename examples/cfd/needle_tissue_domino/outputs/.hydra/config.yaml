      - 2.0
      - 8.0
      - 20.0
      - 50.0
      surface_radii:
      - 1.0
      - 4.0
      - 15.0
      volume_hops: 1
      surface_hops: 1
      volume_neighbors_in_radius:
      - 32
      - 64
      - 128
      - 256
      surface_neighbors_in_radius:
      - 8
      - 16
      - 128
      fourier_features: false
      num_modes: 5
      activation: ${model.activation}
    geo_processor:
      base_filters: 8
      activation: ${model.activation}
      processor_type: conv
      self_attention: false
      cross_attention: false
      volume_sdf_scaling_factor:
      - 0.04
      surface_sdf_scaling_factor:
      - 0.01
      - 0.02
      - 0.04
  local_point_conv:
    activation: ${model.activation}
  nn_basis_functions:
    base_layer: 256
    fourier_features: true
    num_modes: 5
    activation: ${model.activation}
  aggregation_model:
    base_layer: 256
