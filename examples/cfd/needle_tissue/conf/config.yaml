hydra:
  job:
    chdir: true
  run:
    dir: ./outputs/

# Paths
data_dir: "/home/nathanielhoffman/Desktop/cel/physicsnemo/RUN-2"     # directory containing output_XXXX.vtu files
ckpt_path: "./checkpoints"
stats_dir: "./stats"              # written by train split, read by val/test

# Dataset split fractions (of 199 temporal pairs from 200 frames)
# train: ~159 pairs, val: ~20 pairs, test: ~20 pairs
train_fraction: 0.8
val_fraction: 0.1

# -------------------------
# Multi-run dataset
# -------------------------
# For multi-run datasets (files named *-RUN-N_T.vtu), runs are split into
# train/val/test.  timestep_stride subsamples frames within each run:
# stride=1 uses all frames; stride=10 uses every 10th frame.
timestep_stride: 10

# Spatial graph partitioning for training.
# With beam_spacing_mm=1.0 the mesh shrinks to ~39K tissue + ~150 beam nodes.
# Each training sample is one (temporal pair, spatial slice) combination.
# Increase num_parts if you still run out of memory; decrease for more context.
num_parts: 4

# -------------------------
# Needle beam reduction
# -------------------------
# Replace ~7936 needle nodes with a 1-D chain of beam nodes spaced ~1 mm apart.
# Cluster membership is fixed from frame 0 (Lagrangian/material coordinates)
# so the assignment stays valid as the needle bends.
# Set to 0.0 to disable and use the original full needle mesh.
# If you change this value, delete stats/ so normalisation is recomputed.
beam_spacing_mm: 1.0

# -------------------------
# Model architecture
# -------------------------
# Node input: COORD(3) + U(3) + V(3) + A(3) + EVF_VOID(1) + S(6) + CPRESS(1) = 20
#             + mat_E(1) + mat_c10(1) + mat_density(1) + mat_fiber(3)
#             + mat_k1(1) + mat_k2(1) + mat_kappa(1) + mat_nu(1) = 10
#             Total: 30  (same whether beam reduction is on or off)
input_dim_nodes: 30
# Edge input: rel_pos(3) + length(1) + edge_type_onehot(3) = 7
input_dim_edges: 7
# Output: U_next(3) + V_next(3) + A_next(3) = 9
output_dim: 9

hidden_dim_node_encoder: 256
hidden_dim_edge_encoder: 256
hidden_dim_node_decoder: 256
hidden_dim_processor: 256
# With BSMS, 5 vanilla steps + bi-stride U-Net ≈ quality of 15 vanilla steps
# at significantly lower compute cost.  Set to 15 when use_bsms: false.
processor_size: 5
aggregation: "sum"

# -------------------------
# BiStride multi-scale (BSMS)
# -------------------------
# BiStrideMeshGraphNet augments vanilla MGN with a hierarchical U-Net-like
# coarsening pass that propagates long-range information efficiently.
# This allows reducing processor_size (fewer expensive full-graph steps)
# while retaining global context via the coarser scales.
# Requires: uv add sparse-dot-mkl mkl  (already installed)
# MKL runtime must be on LD_LIBRARY_PATH; run with:
#   LD_LIBRARY_PATH=.venv/lib:$LD_LIBRARY_PATH uv run python train.py
use_bsms: true
num_bsms_levels: 2      # coarsening depth; each level halves node count

# -------------------------
# Training
# -------------------------
epochs: 50
batch_size: 1           # each graph has ~47K nodes; keep batch size 1
num_workers: 2
lr: 1e-4
amp: false
jit: false
# Gaussian noise std added to normalised u/v/a inputs during training.
# Forces the model to denoise rollout drift.  0.0 = disabled.  Try 3e-3.
noise_std: 0.0

val_every: 10           # run validation every N epochs
save_every: 50          # save checkpoint every N epochs

# -------------------------
# Inference (infer.py)
# -------------------------
# infer_start_frame: defaults to first test frame (n_train + n_val pairs)
# n_rollout: number of autoregressive steps to predict forward
# infer_output_dir: where to write predicted_XXXX.vtu + predicted.pvd
infer_start_frame: null     # null → first test frame
n_rollout: 20
infer_output_dir: "./inference_output"
# For multi-run datasets: which run to infer on.  null = first test run.
infer_run_id: null

# -------------------------
# WandB
# -------------------------
wandb_mode: "online"
wandb_project: "PhysicsNeMo-Launch"
wandb_entity: "nhoffma1"   # replace with your wandb username / team
