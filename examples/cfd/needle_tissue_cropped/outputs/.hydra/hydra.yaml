    - needle_edge_cap=false
    - data_dir=/home/nathanielhoffman/Desktop/needle_mgn/RUN-2
    - ckpt_path=/home/nathanielhoffman/Desktop/needle_mgn/experiments/cropped_tfn_iso_mgn/checkpoints
    - stats_dir=/home/nathanielhoffman/Desktop/needle_mgn/experiments/cropped_tfn_iso_mgn/stats
    - n_rollout=16
    - axial_polyfit_alpha=1
    - axial_polyfit_degree=3
  job:
    name: infer
