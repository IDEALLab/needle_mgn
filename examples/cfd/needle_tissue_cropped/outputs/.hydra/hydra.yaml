    override_dirname: aggregation=sum,axial_polyfit_alpha=0.0,axial_polyfit_alpha=1,axial_polyfit_degree=3,axial_polyfit_degree=3,beam_spacing_mm=0.0,bistride_unet_levels=1,ckpt_path=/home/nathanielhoffman/Desktop/needle_mgn/experiments/cropped_tfn_iso_mgn/checkpoints,consensus_attenuation=0.0,crop_strategy_weights=[0.7,0.15,0.15],data_dir=/home/nathanielhoffman/Desktop/needle_mgn/RUN-2,drop_targets=[u,a],fourier_scale=0.36,full_needle_tissue_mm=7.0,hidden_dim_edge_encoder=256,hidden_dim_node_decoder=256,hidden_dim_node_encoder=256,hidden_dim_processor=256,infer_output_dir=/home/nathanielhoffman/Desktop/needle_mgn/experiments/cropped_tfn_iso_mgn/inference_output/RUN-199,infer_run_id=199,input_dim_edges=11,irreps_hidden=8x0e
      + 4x1o + 2x2e,l_max=1,max_frames_per_run=null,mgn_include_evf=true,mgn_include_mat_fiber=false,mgn_include_prev_v=true,mgn_kinematic_needle_only=true,mgn_paper_features=true,model_type=tfn,n_fourier_features=64,n_radial_basis=8,n_rollout=16,n_vec_outputs=1,needle_crop_mm=10.0,needle_edge_cap=false,needle_fiber_axis=true,num_bsms_levels=2,num_harmonics=5,num_layers_bistride=2,num_processor_checkpoint_segments=0,per_region_norm=false,processor_size=15,procrustes_alpha=0.0,r_max=60.0,rollout_dt=null,slice_half_thickness_mm=15.0,stats_dir=/home/nathanielhoffman/Desktop/needle_mgn/experiments/cropped_tfn_iso_mgn/stats,tfn_checkpoint_layers=false,timestep_stride=10,tissue_consensus_attenuation=0.0,tissue_crop_mm=25.0,tissue_downsample_mm=0.0,train_fraction=0.8,use_bsms=false,use_cpress=false,use_fourier_features=false,val_fraction=0.1,vector_iso_norm=true,world_edge_radius=1.2
    id: ???
    num: ???
    config_name: config
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.2
    version_base: '1.3'
    cwd: /home/nathanielhoffman/Desktop/needle_mgn/examples/cfd/needle_tissue_cropped
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /home/nathanielhoffman/Desktop/needle_mgn/examples/cfd/needle_tissue_cropped/conf
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: /home/nathanielhoffman/Desktop/needle_mgn/examples/cfd/needle_tissue_cropped/outputs
    choices:
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
