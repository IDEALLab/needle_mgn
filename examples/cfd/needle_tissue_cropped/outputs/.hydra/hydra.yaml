    - drop_targets=[u,a]
    - rollout_dt=null
    - mgn_paper_features=true
    - mgn_include_mat_fiber=false
    - mgn_include_prev_v=true
    - mgn_include_evf=true
    - mgn_kinematic_needle_only=true
    - input_dim_edges=11
    - model_type=tfn
