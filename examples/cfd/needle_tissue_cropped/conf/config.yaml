hydra:
  job:
    chdir: true
  run:
    dir: ./outputs/

# Paths
data_dir: "../../../RUN-2"
ckpt_path: "./checkpoints"
stats_dir: "./stats"

# CUDA device selection.  Set to a string like "0", "1", or "0,1" to restrict
# which GPUs are visible.  null means use whatever is available.
cuda_devices: null

# Dataset split fractions
train_fraction: 0.8
val_fraction: 0.1

# -------------------------
# Multi-run dataset
# -------------------------
# For multi-run datasets (files named *-RUN-N_T.vtu), runs are split into
# train/val/test.  timestep_stride subsamples frames within each run:
# stride=1 uses all frames; stride=10 uses every 10th frame.
timestep_stride: 10
# Cap on frames kept in RAM per run.  null = no cap (keep all strided frames).
# Use this with timestep_stride=1 to limit memory: e.g. max_frames_per_run=25
# gives ~same memory as stride=10 while training on finer-grained timesteps.
max_frames_per_run: null

# -------------------------
# Spatial cropping (the key difference from needle_tissue/)
# -------------------------
# Three crop strategies are available; mix them via crop_strategy_weights.
# Weights are unnormalised — [1, 0, 0] means 100% proximity, [0.7, 0.15, 0.15]
# means 70% proximity / 15% slice / 15% full-needle.
# Val/test always use proximity regardless of these weights.
#
# proximity  — standard: exclude needle nodes > needle_crop_mm from tissue,
#              then tissue nodes > tissue_crop_mm from remaining needle nodes.
# slice      — perpendicular slab of ±slice_half_thickness_mm around a random
#              axial centre; exposes different cross-sections each epoch.
# full_needle — keep all needle nodes + tissue within full_needle_tissue_mm.
#
needle_crop_mm: 10.0
tissue_crop_mm: 25.0
slice_half_thickness_mm: 15.0
full_needle_tissue_mm: 7.0
crop_strategy_weights: [0.7, 0.15, 0.15]

# -------------------------
# Features
# -------------------------
# Set to false to drop contact-pressure (cpress) from inputs and targets.
# With cpress: input_dim_nodes=30, output_dim=17
# Without cpress: input_dim_nodes=29, output_dim=16
use_cpress: true

# Compute separate normalisation statistics for needle and tissue nodes.
# Corrects the scale mismatch for features like cpress (non-zero only on needle
# contact nodes) and stress S (order-of-magnitude difference between the stiff
# needle and soft tissue).  Stats are saved into node_stats.json / target_stats.json
# alongside the global stats, so infer.py detects this automatically.
per_region_norm: false

# Isotropic vector normalisation for u, v, a, mat_fiber: stats are stored as
# (mean=0, std=[s,s,s]) where s is a single scalar across xyz.  Required for
# SE(3)-equivariant models (fiber, fiber_kan, tfn) — per-component (mean, std)
# breaks the 1o-vector property of the normalised target.  Mutually exclusive
# with per_region_norm.
vector_iso_norm: false

# Override mat_fiber on needle nodes with the unit principal SVD axis of the
# frame-0 needle geometry, so fiber_dir is non-zero on the needle and the
# {V, d, V×d} decoder basis includes a transverse direction.  Without this,
# the fiber decoder for needle nodes collapses to α·V (which lies along the
# needle axis by symmetry) and cannot express transverse deflection.
needle_fiber_axis: false

# Drop one or more kinematic vector targets (subset of u/v/a) from the
# model's outputs.  The remaining outputs train as usual; each dropped key
# is handled at inference time as follows:
#   - "u" dropped → Δu derived from predicted Δv via trapezoidal integration
#                   (Δu = (v_t + 0.5 · Δv_pred) · rollout_dt).  Tests the
#                   "predict acceleration/velocity, integrate position"
#                   approach used by Pfaff et al. (MGN, 2020) and Sanchez-
#                   Gonzalez et al. (GNS, 2020).
#   - "v" dropped → v stays stale across rollout; not integrated.  Cannot
#                   coexist with "u" dropped (no predicted v to integrate).
#   - "a" dropped → a stays stale across rollout.
# Hydra list syntax (single-quoted to survive the shell): 'drop_targets=[v,a]'.
# rollout_dt is auto-estimated during training and saved to target_stats.json;
# override here only if the data implies a different timestep.
drop_targets: []
rollout_dt: null

# Pfaff et al. (MGN, 2020) input scheme.  When true:
#   - Node features are reduced to a 2-dim node-type one-hot
#     [needle, tissue]; all dynamic/static state inputs are dropped.
#   - Edge features are augmented from 7-dim to 11-dim:
#     [world_rel(3), world_dist(1), mesh_rel(3), mesh_dist(1), edge_type(3)].
#   - Set input_dim_edges=11 in the slurm script to match.
# Pair with drop_targets=[u,a,evf] + use_cpress=false to predict only the
# MGN-paper outputs (Lagrangian velocity v + von Mises / Voigt stress s).
mgn_paper_features: false

# Append unit fiber direction (3-dim 1o vector) to the MGN-paper input.
# Only meaningful when mgn_paper_features=true.  For TFN this becomes the
# only ``x_vec`` channel (n_node_vec=1); for base/fiber it concatenates onto
# x as 3 extra scalar dims (input_dim_nodes 2 → 5).  When pairing with this
# flag, also enable needle_fiber_axis=true so needle nodes get a non-zero
# fiber direction (otherwise mat_fiber is [0,0,0] for every needle node by
# default and the appended channel is uninformative there).
mgn_include_mat_fiber: false

# Append normalised current velocity (3-dim 1o vector) to the MGN-paper
# input.  Only meaningful when mgn_paper_features=true.  This restores the
# time-varying node input used in Pfaff et al. (2020) (their DeformingPlate
# node features are [node_type, prev_velocity]).  Without it, every node
# input is time-invariant and the model converges to predicting zero —
# val_v_rel_err and val_s_rel_err both stay around 1.0 even after 100
# epochs.  Strongly recommended whenever mgn_paper_features=true.
mgn_include_prev_v: false

# Append normalised current EVF (1 scalar) to the MGN-paper input.  Useful
# for tissue nodes where contact is happening — EVF tells the model where
# material is present without it having to reconstruct that from edge
# geometry.  Goes to x_scalar for TFN.
mgn_include_evf: false

# Mask the per-node loss for kinematic targets (u/v/a) on tissue nodes —
# in our setup tissue u is ~3000× smaller than needle u (the Eulerian mesh
# nodes don't move; u-on-tissue stores the tiny material flow plus
# numerical-noise floor), so penalising the model for getting it wrong
# rewards fitting noise.  Validation rel-errs are computed only over needle
# nodes for the affected keys when this is on.
mgn_kinematic_needle_only: false

# FiberEquivariantMGN architectural extensions (fiber / fiber_kan only).
#
# fiber_extra_invariants:  augment the edge encoder with 4 additional
#   rotation-invariant scalars on top of the existing (cos θ, cos φ):
#     cos_theta_dst = d_j · ê_ij     (symmetric counterpart of cos θ)
#     bond_corr     = cos_θ * cos_θ_dst   (l=2-flavour alignment correlator)
#     dv_along_edge = (v_j - v_i) · ê_ij  (compression rate along the edge)
#     dv_norm       = ||v_j - v_i||       (relative speed)
#   Brings velocity into the per-edge α weights so V is no longer purely
#   fiber-modulated; gives the model a way to break the y-axis symmetry
#   that otherwise locks needle deflection into the x-z plane.
#   Requires graph.node_velocity (always supplied by the dataset).
#
# fiber_extra_decoder_basis:  enrich the decoder's local basis from
#   {V, d, V × d} (3 vectors, can be 1-D when V ∥ d) to
#   {V, d, V × d, W, W × d} (5 vectors, reliably 3-D).  The new aggregate
#   W = Σⱼ βⱼ · (d_i × ê_ij) is by construction perpendicular to d, so the
#   transverse-to-fiber direction is always represented even when V's
#   direction is dominated by axial neighbours.  Adds one beta_head per
#   processor layer plus 2 invariants in node_block / decoder.
fiber_extra_invariants: false
fiber_extra_decoder_basis: false

# Optional per-node 1o vector input fed to FiberEquivariantMGN via
# graph.extra_node_vec (precomputed once by compute_needle_geometry.py and
# saved to <data_dir>/needle_geometry_features.pt).  Mutually exclusive.
#
# bevel_normal_feature:           outward unit normal of the bevel face, on
#                                 needle nodes touching a bevel-classified
#                                 surface face; zero elsewhere.
# surface_contact_normal_feature: outward unit surface normal on needle
#                                 surface nodes, masked per-frame to nodes
#                                 that have at least one world (contact)
#                                 edge.  Zero on non-surface or non-contact
#                                 nodes.
# needle_geometry_path:           override the default path to the .pt file.
bevel_normal_feature: false
surface_contact_normal_feature: false
needle_geometry_path: null

# Global per-frame needle features broadcast to every needle node (zero on
# tissue): centroid offset to each node, principal axis direction, centroid
# velocity, principal-axis angular velocity.  Computed from the *full*
# needle pre-crop so the model gets accurate whole-needle context even when
# the subgraph excludes part of the needle.  Exposed to
# FiberEquivariantMGN(n_global_needle_vecs=4) as 4 × 1o vector channels;
# adds 3*4 = 12 extra edge invariants (cos_theta, cos_phi, |g|).
global_needle_vecs: false

# Rigid-body error loss.  Adds rigid_loss_weight * ||rigid(err)||² to the
# standard MSE, where rigid(err) is the rigid-body component (translation
# Δt + small rotation Δω × r) of the per-needle-node Δu prediction error.
# Penalises whole-body offsets/rotations preferentially over bending.
# Decomposition is done in normalised-Δu units using raw needle coords for
# r; weight is unitless.  0 disables.  Reasonable starting values: 0.3–3.0
# depending on baseline MSE scale.
rigid_loss_weight: 0.0

# Inference-time rigid-body bias correction.  When apply_rigid_correction=true,
# infer.py (and compare_models.RolloutEngine) subtract per-step Δt + Δω × r
# from predicted Δu on needle nodes, where (Δt_k, Δω_k) are training-rollout
# averages cached by compute_rigid_correction.py.  rigid_correction_per_step
# controls whether per-step values (true) or the mean over steps (false) are
# used.  rigid_correction_path overrides the default <stats_dir>/rigid_correction.pt.
apply_rigid_correction: true
rigid_correction_per_step: true
rigid_correction_path: null

# -------------------------
# Model architecture
# -------------------------
# input_dim_nodes and output_dim are derived from use_cpress in train.py;
# the values below are the reference with use_cpress=true.
input_dim_edges: 7

# model_type selects the GNN architecture:
#   "mgn"   — standard MeshGraphNet with MLP node encoder
#   "kan"   — MeshGraphKAN: MLP encoder replaced by a Kolmogorov-Arnold Network
#             node encoder. use_fourier_features is ignored in KAN mode; set
#             num_harmonics instead (controls the KAN Fourier basis width).
#   "fiber" — FiberEquivariantMGN: adds fiber-direction invariant edge features
#             (cos θ, cos φ) and equivariant vector message passing.  Set
#             n_vec_outputs to match the number of 3-D vector output fields
#             (default 3 for u, v, a).
#   "tfn"   — Tensor Field Network: fully equivariant spherical-harmonic-based
#             architecture.  More expensive but encodes strong inductive biases.

model_type: "mgn"
num_harmonics: 5
# Number of 3-D vector outputs decoded equivariantly (fiber/tfn model only).
# With use_cpress=true the first 9 outputs are u/v/a (3 × 3-D vectors).
n_vec_outputs: 3

# TFN (Tensor Field Network) model parameters (model_type=tfn only).
# irreps_hidden: hidden irrep spec, e.g. "16x0e + 8x1o + 4x2e"
# l_max: max spherical harmonic order (1=cheap, 2=default, 3=more angular)
# n_radial_basis: number of Gaussian radial basis functions
# r_max: radial basis cutoff in mm (should cover max edge length)
irreps_hidden: "8x0e + 4x1o + 2x2e"
l_max: 1
n_radial_basis: 8
r_max: 60.0
# Gradient checkpointing for TFN processor layers.  Enable if memory is tight
# (large E with higher-multiplicity irreps_hidden); not needed for the default
# small config.  Has no effect at inference.
tfn_checkpoint_layers: false

# Bi-stride MeshGraphNet (bistride mode only).
# use_bsms must be true when model_type=bistride.  Requires a fixed mesh
# topology — disable dynamic cropping with needle_crop_mm=10000 tissue_crop_mm=10000
# and crop_strategy_weights=[1,0,0].
use_bsms: false
num_bsms_levels: 2
num_layers_bistride: 2
bistride_unet_levels: 1
# Gradient checkpointing: recompute activations during backprop to save memory.
# Must be a factor of 2 × processor_size (e.g. processor_size=15 → use 6 or 10).
# 0 = disabled.
num_processor_checkpoint_segments: 0

# Mesh reduction (beam + tissue downsampling).
# beam_spacing_mm > 0: replace needle HEX nodes with a 1-D beam at this spacing.
# tissue_downsample_mm > 0: keep one tissue node per voxel of this side length.
beam_spacing_mm: 0.0
tissue_downsample_mm: 0.0

# Random Fourier Feature encoding on node inputs (mgn mode only).
# When enabled, node features are mapped through [sin(xB), cos(xB)] before the
# node encoder.  n_fourier_features controls the number of frequency projections
# (output dim = 2 * n_fourier_features).  fourier_scale is the std of the
# Gaussian from which B is sampled.
use_fourier_features: false
n_fourier_features: 64
fourier_scale: .36

hidden_dim_node_encoder: 256
hidden_dim_edge_encoder: 256
hidden_dim_node_decoder: 256
hidden_dim_processor: 256
# No BSMS in this variant (dynamic cropping changes topology each step,
# incompatible with precomputed BSMS coarsenings).
# Use more vanilla processor steps to compensate.
processor_size: 15
aggregation: "sum"

# -------------------------
# Training
# -------------------------
epochs: 200
batch_size: 1
num_workers: 2
lr: 1e-4
amp: true
jit: false
# Gaussian noise std added to normalised u/v/a inputs during training.
# Forces the model to denoise rollout drift.  0.0 = disabled.  Try 3e-3.
noise_std: 3e-3

val_every: 10
save_every: 10

# -------------------------
# Multi-step rollout training (curriculum)
# -------------------------
# When multistep_K > 1, training loss becomes
#   L = (1 - w) * L_1step + w * L_Kstep
# where L_Kstep is the mean MSE over k=1..K predicted increments unrolled
# autoregressively from frame t (same crop, world edges rebuilt each step
# from the predicted needle positions).
#
# Curriculum: w = 0 for the first multistep_warmup_epochs, then ramps
# linearly to multistep_w_max over the remaining epochs.
#
# Caveats: requires per_region_norm=false and mgn_paper_features=false
# (the rollout-state update path is only implemented for the standard
# input scheme).  Recommend batch_size=1 (per-step world-edge rebuild
# uses a CPU cKDTree per graph in the batch).
multistep_K: 1
multistep_w_max: 0.7
multistep_warmup_epochs: 5

# -------------------------
# Inference (infer.py)
# -------------------------
infer_start_frame: null
n_rollout: 20
infer_output_dir: "./inference_output"
# For multi-run datasets: which run to infer on.  null = first test run.
infer_run_id: null
# World edge radius (mm): needle nodes within this distance of a tissue node
# get a world/contact edge.  Must match the EDGE_RADIUS used in
# odb_to_mgn_input.py (default 1.2) to reproduce the training distribution.
world_edge_radius: 1.2
# Consensus filter: fraction of per-needle-node displacement not correlated
# with neighbours to remove.  0.0 = disabled.  Try 0.9–0.99.
consensus_attenuation: 0.0
# Tissue consensus filter: same idea as consensus_attenuation but applied to
# tissue-tissue edges.  Damps random per-node spatial noise on tissue nodes
# that accumulates during long rollouts.  0.0 = disabled.  Try 0.1–0.5.
tissue_consensus_attenuation: 0.0
# Procrustes rigid-body blend on needle displacement.  Each rollout step,
# Kabsch-fits a rigid (R, t) to the predicted needle motion and blends:
#   final_disp = alpha * rigid_disp + (1 - alpha) * predicted_disp
# alpha=0 disables; alpha=1 forces fully rigid needle motion (no bending).
# Intermediate values dampen non-rigid network noise while preserving real
# bending.  Reasonable starting values: 0.3–0.7.
# NOTE: this also kills bending modes — see axial_polyfit_alpha for a more
# permissive alternative that preserves smooth-along-axis bending.
procrustes_alpha: 0.0

# Axial-polynomial-fit blend on needle displacement.  Per spatial component,
# fit predicted Δu as a polynomial of degree axial_polyfit_degree along the
# needle's principal axis, then blend:
#   final_disp = alpha * polyfit + (1 - alpha) * predicted_disp
# Preserves smooth-along-axis modes (translation, tilt, parabolic / cubic
# bending) and rejects per-node high-frequency noise.  alpha=0 disables;
# alpha=1 replaces the prediction with its polynomial fit.
# degree=1 ≈ Procrustes (rigid-only); degree=3 captures clamped-cantilever
# bending; degree=5 admits S-curves.
axial_polyfit_alpha: 0.0
axial_polyfit_degree: 3
# Base-clamp inference scheme: at every rollout step, override the state on
# needle nodes within `base_clamp_mm` of the base end (min axial coord; the
# tip is at max axial) with their ground-truth values at that time step.
# Models predict the rest of the needle and the tissue as usual.  0 disables.
# Useful when the base is tracked / controlled in deployment (e.g. robotic
# insertion fixture) so the model only has to predict downstream motion.
base_clamp_mm: 0.0

# Needle edge length cap: if true, scale needle displacements each rollout step
# so that no needle-to-needle edge changes length by more than the maximum
# observed during training.  Requires needle_edge_stats.json in stats_dir
# (run compute_needle_edge_stats.py once after training to generate it).
needle_edge_cap: false

# -------------------------
# WandB
# -------------------------
wandb_mode: "online"
wandb_project: "PhysicsNeMo-Launch"
wandb_entity: "nhoffma1"
wandb_log_artifact: true
