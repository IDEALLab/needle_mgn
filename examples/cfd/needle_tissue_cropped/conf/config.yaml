hydra:
  job:
    chdir: true
  run:
    dir: ./outputs/

# Paths
data_dir: "../../../RUN-2"
ckpt_path: "./checkpoints"
stats_dir: "./stats"

# CUDA device selection.  Set to a string like "0", "1", or "0,1" to restrict
# which GPUs are visible.  null means use whatever is available.
cuda_devices: null

# Dataset split fractions
train_fraction: 0.8
val_fraction: 0.1

# -------------------------
# Multi-run dataset
# -------------------------
# For multi-run datasets (files named *-RUN-N_T.vtu), runs are split into
# train/val/test.  timestep_stride subsamples frames within each run:
# stride=1 uses all frames; stride=10 uses every 10th frame.
timestep_stride: 10
# Cap on frames kept in RAM per run.  null = no cap (keep all strided frames).
# Use this with timestep_stride=1 to limit memory: e.g. max_frames_per_run=25
# gives ~same memory as stride=10 while training on finer-grained timesteps.
max_frames_per_run: null

# -------------------------
# Spatial cropping (the key difference from needle_tissue/)
# -------------------------
# Three crop strategies are available; mix them via crop_strategy_weights.
# Weights are unnormalised — [1, 0, 0] means 100% proximity, [0.7, 0.15, 0.15]
# means 70% proximity / 15% slice / 15% full-needle.
# Val/test always use proximity regardless of these weights.
#
# proximity  — standard: exclude needle nodes > needle_crop_mm from tissue,
#              then tissue nodes > tissue_crop_mm from remaining needle nodes.
# slice      — perpendicular slab of ±slice_half_thickness_mm around a random
#              axial centre; exposes different cross-sections each epoch.
# full_needle — keep all needle nodes + tissue within full_needle_tissue_mm.
#
needle_crop_mm: 10.0
tissue_crop_mm: 25.0
slice_half_thickness_mm: 15.0
full_needle_tissue_mm: 7.0
crop_strategy_weights: [0.7, 0.15, 0.15]

# -------------------------
# Features
# -------------------------
# Set to false to drop contact-pressure (cpress) from inputs and targets.
# With cpress: input_dim_nodes=30, output_dim=17
# Without cpress: input_dim_nodes=29, output_dim=16
use_cpress: true

# Compute separate normalisation statistics for needle and tissue nodes.
# Corrects the scale mismatch for features like cpress (non-zero only on needle
# contact nodes) and stress S (order-of-magnitude difference between the stiff
# needle and soft tissue).  Stats are saved into node_stats.json / target_stats.json
# alongside the global stats, so infer.py detects this automatically.
per_region_norm: false

# -------------------------
# Model architecture
# -------------------------
# input_dim_nodes and output_dim are derived from use_cpress in train.py;
# the values below are the reference with use_cpress=true.
input_dim_edges: 7

# model_type selects the GNN architecture:
#   "mgn"   — standard MeshGraphNet with MLP node encoder
#   "kan"   — MeshGraphKAN: MLP encoder replaced by a Kolmogorov-Arnold Network
#             node encoder. use_fourier_features is ignored in KAN mode; set
#             num_harmonics instead (controls the KAN Fourier basis width).
#   "fiber" — FiberEquivariantMGN: adds fiber-direction invariant edge features
#             (cos θ, cos φ) and equivariant vector message passing.  Set
#             n_vec_outputs to match the number of 3-D vector output fields
#             (default 3 for u, v, a).
model_type: "mgn"
num_harmonics: 5
# Number of 3-D vector outputs decoded equivariantly (fiber/tfn model only).
# With use_cpress=true the first 9 outputs are u/v/a (3 × 3-D vectors).
n_vec_outputs: 3

# TFN (Tensor Field Network) model parameters (model_type=tfn only).
# irreps_hidden: hidden irrep spec, e.g. "16x0e + 8x1o + 4x2e"
# l_max: max spherical harmonic order (1=cheap, 2=default, 3=more angular)
# n_radial_basis: number of Gaussian radial basis functions
# r_max: radial basis cutoff in mm (should cover max edge length)
irreps_hidden: "64x0e + 32x1o + 16x2e"
l_max: 2
n_radial_basis: 8
r_max: 60.0

# Bi-stride MeshGraphNet (bistride mode only).
# use_bsms must be true when model_type=bistride.  Requires a fixed mesh
# topology — disable dynamic cropping with needle_crop_mm=10000 tissue_crop_mm=10000
# and crop_strategy_weights=[1,0,0].
use_bsms: false
num_bsms_levels: 2
num_layers_bistride: 2
bistride_unet_levels: 1
# Gradient checkpointing: recompute activations during backprop to save memory.
# Must be a factor of 2 × processor_size (e.g. processor_size=15 → use 6 or 10).
# 0 = disabled.
num_processor_checkpoint_segments: 0

# Mesh reduction (beam + tissue downsampling).
# beam_spacing_mm > 0: replace needle HEX nodes with a 1-D beam at this spacing.
# tissue_downsample_mm > 0: keep one tissue node per voxel of this side length.
beam_spacing_mm: 0.0
tissue_downsample_mm: 0.0

# Random Fourier Feature encoding on node inputs (mgn mode only).
# When enabled, node features are mapped through [sin(xB), cos(xB)] before the
# node encoder.  n_fourier_features controls the number of frequency projections
# (output dim = 2 * n_fourier_features).  fourier_scale is the std of the
# Gaussian from which B is sampled.
use_fourier_features: false
n_fourier_features: 64
fourier_scale: .36

hidden_dim_node_encoder: 256
hidden_dim_edge_encoder: 256
hidden_dim_node_decoder: 256
hidden_dim_processor: 256
# No BSMS in this variant (dynamic cropping changes topology each step,
# incompatible with precomputed BSMS coarsenings).
# Use more vanilla processor steps to compensate.
processor_size: 15
aggregation: "sum"

# -------------------------
# Training
# -------------------------
epochs: 200
batch_size: 1
num_workers: 2
lr: 1e-4
amp: true
jit: false
# Gaussian noise std added to normalised u/v/a inputs during training.
# Forces the model to denoise rollout drift.  0.0 = disabled.  Try 3e-3.
noise_std: 3e-3

val_every: 10
save_every: 10

# -------------------------
# Inference (infer.py)
# -------------------------
infer_start_frame: null
n_rollout: 20
infer_output_dir: "./inference_output"
# For multi-run datasets: which run to infer on.  null = first test run.
infer_run_id: null
# Consensus filter: fraction of per-needle-node displacement not correlated
# with neighbours to remove.  0.0 = disabled.  Try 0.9–0.99.
consensus_attenuation: 0.0
# Needle edge length cap: if true, scale needle displacements each rollout step
# so that no needle-to-needle edge changes length by more than the maximum
# observed during training.  Requires needle_edge_stats.json in stats_dir
# (run compute_needle_edge_stats.py once after training to generate it).
needle_edge_cap: false

# -------------------------
# WandB
# -------------------------
wandb_mode: "online"
wandb_project: "PhysicsNeMo-Launch"
wandb_entity: "nhoffma1"
wandb_log_artifact: true
